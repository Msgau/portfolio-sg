    <script>
      // Restaure le chemin transmis par 404.html (voir public/404.html)
      (function (l) {
        if (l.search[1] === '/') {
          var d = l.search.slice(1).split('&').map(function (s) { return s.replace(/~and~/g, '&'); }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + d + l.hash);
        } else if (l.hash.indexOf('#/') === 0) {
          // Anciennes URLs à base de # (#/works -> /projets)
          var p = l.hash.slice(1);
          if (p === '/works') p = '/projets';
          if (p === '/home') p = '/';
          var base = l.pathname.charAt(l.pathname.length - 1) === '/' ? l.pathname.slice(0, -1) : l.pathname;
          window.history.replaceState(null, null, base + p);
        }
      })(window.location);
    </script>
  </head>
